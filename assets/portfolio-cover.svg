    <text x="774" y="160" fill="#c9f77c" font-size="11" letter-spacing="2">THE WORKING MODEL</text>
    <rect x="774" y="179" width="178" height="60" rx="10" fill="#252832" stroke="#5b5d69"/>
    <text x="792" y="202" fill="#aeb1ba" font-size="10" letter-spacing="1.4">01 / UNDERSTAND</text>
    <text x="792" y="224" fill="#f7f5ee" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700">The problem</text>
    <path d="M953 209 H981" stroke="#c9f77c" stroke-width="2"/>
    <path d="M975 203 L982 209 L975 215" fill="none" stroke="#c9f77c" stroke-width="2"/>
    <rect x="986" y="179" width="190" height="60" rx="10" fill="#252832" stroke="#5b5d69"/>
    <text x="1004" y="202" fill="#aeb1ba" font-size="10" letter-spacing="1.4">02 / ENGINEER</text>
    <text x="1004" y="224" fill="#f7f5ee" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700">The system</text>
    <path d="M1081 239 V260 H878 V275" fill="none" stroke="#766bfa" stroke-width="1.6" stroke-dasharray="4 5"/>
    <path d="M872 268 L878 276 L884 268" fill="none" stroke="#766bfa" stroke-width="1.6"/>
    <rect x="774" y="279" width="402" height="55" rx="10" fill="#292c34" stroke="#7064ed"/>
    <rect x="774" y="279" width="5" height="55" rx="2.5" fill="url(#violet)"/>
    <text x="794" y="301" fill="#aea4ff" font-size="10" letter-spacing="1.4">03 / DELIVER</text>
    <text x="794" y="320" fill="#f7f5ee" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">An experience that works end to end.</text>
    <path d="M774 354 H1176" stroke="#454751"/>
    <text x="774" y="376" fill="#aeb1ba" font-size="10" letter-spacing="1.8">PORTFOLIO INDEX</text>
