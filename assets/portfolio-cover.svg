      <rect x="774" y="390" width="90" height="64" rx="9" fill="#24272f"/>
      <rect x="874" y="390" width="90" height="64" rx="9" fill="#24272f"/>
      <rect x="974" y="390" width="90" height="64" rx="9" fill="#24272f"/>
      <rect x="1074" y="390" width="102" height="64" rx="9" fill="#24272f"/>
      <text x="788" y="419" fill="#e4ff8b" font-size="25" letter-spacing="-1.5">11</text>
      <text x="788" y="438" fill="#aeb1ba" font-size="9" letter-spacing=".8">PROJECTS</text>
      <text x="888" y="419" fill="#e4ff8b" font-size="25" letter-spacing="-1.5">07</text>
      <text x="888" y="438" fill="#aeb1ba" font-size="9" letter-spacing=".8">HACKATHON</text>
      <text x="988" y="419" fill="#e4ff8b" font-size="25" letter-spacing="-1.5">03</text>
      <text x="988" y="438" fill="#aeb1ba" font-size="9" letter-spacing=".8">CLIENT</text>
      <text x="1088" y="419" fill="#e4ff8b" font-size="25" letter-spacing="-1.5">04</text>
      <text x="1088" y="438" fill="#aeb1ba" font-size="9" letter-spacing=".8">LIVE LINKS</text>
    </g>
  </g>
  <text x="1207" y="526" text-anchor="end" fill="#aeb1ba" opacity=".75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">BUILD LOG / N S</text>
