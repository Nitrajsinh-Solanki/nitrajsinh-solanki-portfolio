<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Nitrajsinh Solanki — Portfolio engineering</title>
  <desc id="desc">A bespoke dark editorial poster describing full-stack product engineering, with a connected flow from problem to system to experience and portfolio metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14151a"/>
      <stop offset="1" stop-color="#20232a"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4ff8b"/>
      <stop offset="1" stop-color="#b4e66a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aea0ff"/>
      <stop offset="1" stop-color="#7164eb"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#a6a9b2" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="50" r="260" fill="#7567ef" opacity=".08"/>
  <circle cx="1180" cy="500" r="250" fill="#c9f77c" opacity=".055"/>
  <path d="M0 463 C180 425 300 535 515 476 S710 450 820 492" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1.5"/>
  <path d="M0 483 C180 445 300 555 515 496 S710 470 820 512" fill="none" stroke="#c9f77c" stroke-opacity=".18" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.4">
    <rect x="72" y="54" width="220" height="31" rx="15.5" fill="#e4ff8b"/>
    <circle cx="90" cy="69.5" r="4" fill="#20232a"/>
    <text x="104" y="74" fill="#20232a" font-weight="700" letter-spacing="1.4">FIELD NOTES / 001</text>
    <text x="72" y="128" fill="#aeb1ba" font-size="12" letter-spacing="3">PRODUCT ENGINEERING · GUJARAT, INDIA</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="66" y="213" fill="#f7f5ee" font-size="66" letter-spacing="-2.5">NITRAJSINH</text>
    <text x="66" y="315" fill="url(#lime)" font-size="102" letter-spacing="-5">SOLANKI<tspan fill="#f7f5ee">.</tspan></text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#dadbe0">
    <text x="74" y="365">I build the parts people feel —</text>
    <text x="74" y="397">from the first API to the final interaction.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">
    <text x="74" y="451" fill="#aeb1ba">WEB / MOBILE / DATA / AI</text>
    <path d="M74 472 H500" stroke="#aeb1ba" stroke-opacity=".28"/>
    <text x="74" y="501" fill="#c9f77c">DESIGN FOR CLARITY</text>
    <text x="276" y="501" fill="#aeb1ba">BUILD FOR REAL USE</text>
  </g>
  <g filter="url(#shadow)">
